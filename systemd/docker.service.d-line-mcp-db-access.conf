# /etc/systemd/system/docker.service.d/line-mcp-db-access.conf
# Docker resets /var/lib/docker to 0710 root:root on every daemon start, which blocks the
# unprivileged `line` service user from reaching the LINE SQLite files inside the redroid-data
# volume (direct read mode). Re-grant traverse (x only — no listing) after each start.
# Verified 2026-08-23 on CT103: with o+x the `line` user reads naver_line/contact read-only.
[Service]
ExecStartPost=/bin/chmod o+x /var/lib/docker
