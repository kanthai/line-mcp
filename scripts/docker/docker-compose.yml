# Deploy to /mnt/APP/agent-stack/ on TrueNAS
# WAYDROID_VM_IP: update line-mcp URL in openclaw.json after VM is provisioned
services:
  openclaw:
    build: ./openclaw
    container_name: openclaw
    restart: unless-stopped
    network_mode: host
    env_file:
      - /mnt/APP/agent-data/config/openclaw.env
    environment:
      - HOME=/home/kanthai
      - NODE_PATH=/home/kanthai/.npm-global/lib/node_modules
      - ANTHROPIC_API_KEY=local
    volumes:
      - /mnt/APP/agent-data/openclaw:/home/kanthai/.openclaw
      - /mnt/APP/agent-data/npm-global:/home/kanthai/.npm-global:ro
      - /mnt/APP/agent-data/config:/home/kanthai/.config:ro
      - /mnt/APP/agent-data/vault:/home/kanthai/vault:ro
      - /mnt/APP/agent-data/claude:/home/kanthai/.claude

  hermes:
    build: ./hermes
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    env_file:
      - /mnt/APP/agent-data/config/openclaw.env
    environment:
      - HOME=/home/kanthai
      - ANTHROPIC_API_KEY=local
    volumes:
      - /mnt/APP/agent-data/hermes:/home/kanthai/.hermes
      - /mnt/APP/agent-data/config:/home/kanthai/.config:ro
      - /mnt/APP/agent-data/claude:/home/kanthai/.claude:ro
      - /mnt/APP/agent-data/npm-global:/home/kanthai/.npm-global:ro
      - /mnt/APP/agent-data/vault:/home/kanthai/vault:ro
