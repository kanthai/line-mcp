# /etc/modules-load.d/binder.conf on the Proxmox host.
# Loads the binder driver at boot. The PVE kernel only provides binderfs (no classic
# /dev/binder char devices) and assigns it a DYNAMIC major that changes every boot —
# redroid-binder.service grants the current major to the LXC at each start.
# NB: "options binder_linux num_binders=255" is rejected by this kernel (no-op) — do not add it.
binder_linux
